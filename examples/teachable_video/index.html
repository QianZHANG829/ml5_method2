<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teachable Video</title>

  <!-- p5.js + Tone.js + ml5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
  <script src="../../dist/ml5.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <h1>Teachable Video</h1>
    <p class="site-subtitle">Video-based motion dataset labeling for AI training</p>
  </header>

  <main class="grid">
    <!-- LEFT COLUMN: Classes -->
    <section class="column classes-panel">

      <!-- class 卡片模板（隐藏） -->
      <template id="class-card-template">
        <div class="class-card card">
          <div class="card-header">
            <span>Class X</span>
            <div class="card-controls">
              <button class="icon-btn edit-btn"  title="Edit Class">✎</button>
              <button class="icon-btn more-btn"  title="More">⋮</button>
              <ul class="more-menu">
                <li class="delete-class">Delete Class</li>
              </ul>
            </div>
          </div>
          <div class="card-body">
            <div class="label-title">Add Video Samples:</div>
            <div class="sample-btns">
              <button class="sample-btn webcam-btn">🎥<br><span>Webcam</span></button>

              <!-- 独立 input，用 JS 动态设置 id -->
              <input type="file" accept="video/*" style="display:none">

              <button class="sample-btn upload-btn">⬆️<br><span>Upload</span></button>
            </div>
          </div>
        </div>
      </template>


      <!-- ⭐  Class 1 卡片（保留原结构） -->
      <div class="class-card card">
        <div class="card-header">
          <span>Class 1</span>
          <div class="card-controls">
            <button class="icon-btn edit-btn" id="edit-class-btn" title="Edit Class">✎</button>
            <button class="icon-btn more-btn" title="More">⋮</button>
            <ul class="more-menu">
              <li class="delete-class">Delete class</li>
            </ul>            
            
          </div>
        </div>
        <div class="card-body">
          <div class="label-title">Add Video Samples:</div>
          <div class="sample-btns">
            <button class="sample-btn webcam-btn">🎥<br><span>Webcam</span></button>
            <input id="video-upload-1" type="file" accept="video/*" style="display:none" />
            <button class="sample-btn upload-btn" onclick="document.getElementById('video-upload-1').click()">
              ⬆️<br><span>Upload</span>
            </button>
          </div>
        </div>
      </div>

   


      <button class="class-add-btn">+ Add a class</button>

    </section>

    <!-- CENTER COLUMN: Training -->
    <section class="column training">
      <div class="card">
        <div class="card-header"><span>Training</span></div>
        <div class="card-body">
          <button class="full-btn" id="train-btn">Train Model</button>
        </div>
      </div>
    </section>

    <!-- RIGHT COLUMN: Preview -->
    <section class="column preview">
      <div class="card">
        <div class="card-header">
          <span>Preview</span>
          <button class="icon-btn export-btn" id="export-model-btn" title="Export Model">⬇️</button>
        </div>
        <div class="card-body">
          <p class="help-text">You must train a model on the left before you can preview it here.</p>
        </div>
      </div>
    </section>
    <!-- 🎯 Canvas 视频+识别 展示区域 -->
    <section class="canvas-preview span-2-3">
      <div class="canvas-frame">          <!-- ★ 新增：固定比例外框 -->

        <div id="canvas-container" class="card" 
              style="margin: 2rem auto; text-align: center;"></div>

        <!-- 🔹① 新加：标注工具条 -->
        <div id="annot-toolbar" class="annot-bar" >
          <span id="class-name">Class 1</span>

          fps =
          <input id="fps-input"  type="number" value="30" min="1" style="width:60px">

          duration (s) =
          <input id="dur-input"  type="number" value="15" min="1" style="width:60px">

          <button id="collect-btn" class="collect-btn">Start to collect</button>

          <!-- ★ 新增：进度文字容器 -->
          <span id="collect-progress"
          style="margin-left:12px;font-size:14px;color:#555;"></span>
        </div>

        <!-- Timeline 区块，跟 canvas 对齐 -->
        <div id="timeline-container" style="margin: 0 auto; width: fit-content;">
          <!-- 🟦 时间轴组件：包含刻度 + 区块 -->
          <div id="timeline-wrapper" style="position: relative; height: 36px; margin-top: 8px;">
            <!-- 灰色背景轨道 -->
            <div id="timeline-track" style="position: absolute; top: 0; height: 12px; width: 100%; background: #ddd; border-radius: 3px;"></div>
            <!-- ✅ 标注区块容器（唯一的 label-timeline） -->
            <div id="label-timeline" style="position: absolute; top: 0; height: 12px; width: 100%;"></div>
            <!-- 时间刻度标签 -->
            <div id="timeline-labels" style="position: absolute; top: -14px; font-size: 10px; color: #666; width: 100%; display: flex; justify-content: space-between;"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 你已有的 JS 代码，保持不动 -->
  <script src="js/collect.js"></script>
  <!-- <script src="js/labeler.js"></script> -->

  <script>
    /* ========= 给一张卡片绑定“⋮”菜单 ========= */
    function bindMenu(card){
      const moreBtn = card.querySelector('.more-btn');
      const menu    = card.querySelector('.more-menu');
      if(!moreBtn || !menu) return;
    
      /* ① 点击 ⋮ 显示 / 隐藏菜单 */
      moreBtn.addEventListener('click',  (ev)=>{
        ev.stopPropagation();
        // 先把别的菜单都收起
        document.querySelectorAll('.more-menu').forEach(m=>{
          if(m!==menu) m.style.display='none';
        });
        menu.style.display = (menu.style.display==='block') ? 'none':'block';
      });
    
      /* ② 点击 Delete class */
      const delItem = menu.querySelector('.delete-class');
      if(delItem){
        delItem.addEventListener('click', ()=>{
          if(confirm('Delete this class?')){
            card.remove();
          }
        });
      }
    
      /* ③ 点击页面任意空白处，收起菜单 */
      document.addEventListener('click', ()=> menu.style.display='none');
      
    }
    /* 让页面现有的 Class 1 生效 */
    bindMenu(document.querySelector('.class-card'));
  </script>
    

  <!-- 新增绑定逻辑：上传视频并展示 -->
  <script>
    // 上传视频 → 调用 sketch.js 中的 handleFile(file)
    document.getElementById('video-upload-1')
      .addEventListener('change', e => {
        const file = e.target.files[0];
        if (file) {
          handleFile(file);
        }
      });

    // 训练按钮
    document.getElementById('train-btn')
      .addEventListener('click', () => {
        if (typeof classifier !== 'undefined') {
          classifier.normalizeData();
          classifier.train({ epochs: 5 }, finishedTraining);
        }
      });

    // 导出数据
    document.getElementById('export-model-btn')
      .addEventListener('click', () => {
        if (typeof classifier !== 'undefined') {
          classifier.saveData();
        }
      });

  /* —— 全局保存当前类名 —— */
 
    /* ───────────────
       1️⃣ 当前激活的类名
    ──────────────── */
    let className = "Class 1";          // 页面初始值
    document.getElementById('class-name').textContent = className;
    
    /* ───────────────
       2️⃣ ✎ 按钮改名
    ──────────────── */
    document.getElementById('edit-class-btn').addEventListener('click', ()=>{
      const newName = prompt("Rename this class:", className);
      if(!newName) return;
      className = newName.trim();                       // ← ❶ 关键：覆盖全局
      if(!className) return;
    
      // 更新显示
      document.querySelector('.class-card .card-header span').textContent = className;
      document.getElementById('class-name').textContent       = className;
    });
    
    /* ───────────────
       3️⃣ Start to collect
    ──────────────── */
    document.getElementById('collect-btn').addEventListener('click', ()=>{
      const fps = +document.getElementById('fps-input').value || 30;
      const dur = +document.getElementById('dur-input').value || 15;

    
      
      /* 关键：通过 window 访问 collect.js 暴露的函数 */
      window.setFpsAndDuration(fps, dur);         // 修改 FPS & CAPTURE_FRAMES
      startCollection(className);       // <-- 把当前 className 传进去
    });


  </script>

  <script>
   

    /* ① 对已有的 Class 1 调用一次 */
    bindMenu(document.querySelector('.class-card'));



    /* 计数器：Class 1 已经存在，从 2 开始 */
    let classCount = 1;
    
    /* 点击 “Add a class” */
    document.querySelector('.class-add-btn').addEventListener('click', ()=>{
    
      classCount++;
      const label   = `Class ${classCount}`;
      const tpl     = document.getElementById('class-card-template');
      const cardEl  = tpl.content.firstElementChild.cloneNode(true);   // 深拷贝
    
      /* 更新标题文字 */
      cardEl.querySelector('.card-header span').textContent = label;
    
      /* 给 upload input / button 配唯一 id */
      const inputEl  = cardEl.querySelector('input[type=file]');
      const uploadBt = cardEl.querySelector('.upload-btn');
    
      const uid = `video-upload-${classCount}`;
      inputEl.id = uid;
      uploadBt.onclick = ()=> document.getElementById(uid).click();
    
      /* 绑定文件选择事件 */
      inputEl.addEventListener('change', e=>{
        const file = e.target.files[0];
        if (file) handleFile(file);
      });
    
      /* ✎ 按钮改名（与 Class 1 的逻辑相同） */
      cardEl.querySelector('.edit-btn').addEventListener('click', function (){
        const card    = this.closest('.class-card');                 // 当前这张卡片
        const spanEl  = card.querySelector('.card-header span');     // 标题位置
        const newName = prompt("Rename this class:", spanEl.textContent);
        if (newName){
          spanEl.textContent = newName.trim();
        }
      });

      /* ……克隆 cardEl 的代码 …… */
      bindMenu(cardEl);  
      
    
      /* 将新卡片插入 Classes 列（在 “Add a class” 按钮前）*/
      document.querySelector('.classes-panel')
              .insertBefore(cardEl, document.querySelector('.class-add-btn'));
    });
  </script>
    
</body>
</html>
